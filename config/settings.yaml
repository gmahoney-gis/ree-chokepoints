  # Interactive web map (S11c, tasks 6.9 and 6.12; Decision 17). Colours come from outputs.style and
  # the score classes from score_class_breaks, as on the poster; short names from outputs.poster.short_names.
  web:
    as_of: "2026-10-31"              # date the results last changed (S09/S10); shown on the page
    as_of_note: "trade 2025 · events Oct 2024–Sep 2025"   # shown after the date
    title: "Rare Earth Trade Vulnerability at Maritime Chokepoints"
    subtitle: "Where 2025 shipping of rare earth elements (REEs) meets conflict and has no easy detour"
    author: "Garrett Mahoney · GEOG797 · University of Maryland"
    repo_url: "https://github.com/gmahoney-gis/ree-chokepoints"
    how_to_read:
      - "Each circle is a maritime chokepoint; colour and size show its composite vulnerability score."
      - "Every circle carries its rank (1 = most exposed). Tap a circle, or a name in the list, for details. Zoom in to separate overlapping circles."
      - "Switch scenario to see the ranking if ships avoid the Red Sea (Suez and Bab el-Mandeb closed)."
    exposure_kinds:                  # the three score components, in the order trade, conflict, redundancy
      - ["Volume", "how much 2025 seaborne rare earth trade passes through"]
      - ["Conflict", "violent events and political tension within {ring_km} km"]   # {ring_km} = conflict.ring_main_km
      - ["No alternative", "how much longer routes get, or whether any sea route is left, if it closes"]
    # "Why the Red Sea?" paragraph. Figures copied from: PortWatch container transits in
    # outputs/tables/red_sea_context.csv (Suez 6,977 in 2023, 3,351 in 2025; Cape 2,249 -> 7,387);
    # the S08b log, task 4.17 Cape-only (8.98 days, US$ 801,750 one way); reroute_impact.suez_check
    # (10 days, US$ 850,000 one way); outputs/tables/scenarios.csv (Suez 2 -> 13, Bab el-Mandeb 7 -> 22); impact_days of
    # Suez in chokepoint_scores (7.1). Update them by hand if those outputs change.
    red_sea:
      title: "Why the Red Sea?"
      text:
        - "Since late 2023, attacks on merchant ships by Yemen's Houthi movement have led many container ships to avoid the Red Sea and sail around Africa's Cape of Good Hope instead of using the Suez Canal. Container-ship transits of Suez fell by half, from 6,977 in 2023 to 3,351 in 2025, while those rounding the Cape more than tripled (IMF PortWatch). It is the one large real-world diversion away from a chokepoint in the study period."
        - "Going around the Cape adds about 9 days at sea and US$ 0.8 million per one-way container-ship voyage in this study (ITF/OECD estimate: 10 days, US$ 0.85 million). The Suez pop-up shows a shorter 7.1 days because it closes Suez alone, so some detours go via Panama instead of the Cape."
        - "The Red Sea diversion button shows the ranking if all rare earth trade that used the Red Sea went around the Cape instead (Suez and Bab el-Mandeb closed). Conflict and detour scores stay the same; Suez falls from 2nd to 13th and Bab el-Mandeb from 7th to 22nd."
    caveat: "GDELT places many events at a few cities (e.g. Gaza near Suez; one Crimea point near Kerch)."
    data_note: "Only derived counts are published; no event locations."
    credits: ["UN Comtrade", "IMF PortWatch", "ACLED", "GDELT", "IMO GISIS", "Natural Earth",
              "searoute / Eurostat MARNET", "ITF/OECD (Merk 2024)"]
    scenario_labels: {baseline: "Baseline 2025", red_sea_diversion: "Red Sea diversion"}
    leaflet:                         # loaded from the CDN with integrity hashes (checked 8 Nov 2026)
      base: "https://unpkg.com/leaflet@1.9.4/dist/"
      js_sri: "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      css_sri: "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    # CARTO Dark Matter (the plan) now answers every keyless request with an "API key required"
    # tile (checked 8 Nov 2026), so the base map is one of these two kinds:
    basemap:
      kind: natural_earth            # natural_earth: land and borders drawn from paths.raw_files.natural_earth_countries
                                     # in the house colours (no key, no tile service); tiles: the tile service below
      land_simplify_deg: 0.05        # natural_earth: simplification (about 5 km)
      land_attribution: "Made with Natural Earth"
      tiles_url: "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"
      tiles_attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors"
      max_zoom: {natural_earth: 6, tiles: 8}
    start_view: {lat: 20, lon: 60, zoom: 2, zoom_narrow: 1.5}   # zoom_narrow below narrow_screen_px
    # Pan and zoom limits. Where the screen is taller or wider than the allowed area, Leaflet centres the
    # map on that area; the limits are set so the opening view never moves:
    # - north-south: S11c sets the south edge so that start_view.lat is the middle of the area in Web
    #   Mercator (about -69.7 for north 80);
    # - east-west: limited to west..east only while the map window is narrower than that band at the
    #   current zoom (re-checked on zoom and on a change of window width); otherwise free (the map wraps
    #   the world), within lon_half_width degrees either side of start_view.lon. At start-up the limit
    #   applies only if the whole opening view already lies inside the band.
    max_bounds: {north: 80, west: -200, east: 200, lon_half_width: 3600}
    max_bounds_viscosity: 1.0        # 1 = the view springs back fully at the edges
    min_zoom: {wide: 2, narrow: 1.5} # equal to the opening zooms, so the opening view is always allowed
    narrow_screen_px: 600            # below this width the panel starts collapsed
    top_n_labels: 27                 # circles that carry their rank number (Stage 1b: all 27)
    marker_radius_px: [11, 12, 13, 15, 17] # one per score class, low to high; the smallest fits two digits
    rank_min_radius_px: 11           # a numbered circle is at least this big (two digits)
    hit_radius_px: 18                # tap target round every circle
    coord_decimals: 3                # GeoJSON coordinates (about 100 m)
    value_decimals: 4                # GeoJSON numbers (the database keeps full precision)
    max_page_mb: 3                   # S11c warns if the published files pass this (CDN files not counted)
    # Stage 2a: trade routes (web_routes). Routes are cut into sea-lane segments, trade value summed per
    # segment and scenario (both directions together), and runs of segments with equal value joined.
    # Colour is outputs.style.route; both width and opacity grow with the square root of the segment value.
    route_width_px: [0.7, 7]         # [thinnest, the busiest segment]
    route_opacity: [0.35, 0.85]      # [thinnest, the busiest segment], on the same square-root scale as the width
    route_tap_tolerance_px: 8        # extra pixels round a line that still count as a tap on it
    route_simplify_deg: 0.01         # web files only (about 1 km); the database keeps full detail
    route_join_decimals: 2           # segment values rounded to the cent; segments of equal rounded value are joined
    route_value_decimals: 0          # value_usd in the web files (whole dollars)
    route_legend: "Trade route (wider = more trade)"
    legend_button: ["Legend", "Hide legend"]   # below narrow_screen_px the legend starts closed behind this button
    route_popup: "Trade on this segment: {value} (both directions)"
    route_popup_note: "A segment can carry more than a chokepoint's total, because routes that do not pass through the chokepoint also use it."
    # Shown in the panel when a scenario leaves port pairs with no sea route. {pairs}, {value} and {ports}
    # (the ports cut off, each of which every one of those pairs starts or ends at) are filled by S11c.
    no_route_note: "{pairs} port pairs ({value} of trade, all to or from {ports}) have no sea route in this scenario and are not drawn."
    # Stage 2b: chokepoint zones and gate lines (from the zones and gates layers), one file loaded the
    # first time the box is ticked. Gated straits show only their gate line, not their map-only circle.
    zone_simplify_deg: 0.01          # about 1 km
    zone_style: {weight: 1, opacity: 0.9, fill_opacity: 0.08, gate_weight: 2.5}   # colour: outputs.style.highlight
    zones_label: "Show chokepoint zones"
    zones_note: "Circles show where a route counts as passing through. Four wide straits use a line drawn across the passage instead."
    # Ranked list in the panel (short names from outputs.poster.short_names).
    closed_label: "closed"           # list and legend: a chokepoint closed in the scenario
    closed_heading: "Closed in this scenario"   # pop-up / bottom sheet of a closed chokepoint
    list_zoom: 4                     # tapping a name zooms in at least this far

# ---------------------------------------------------------------------
# Integrity check of the project database (check_db.py, task 3.2)
# ---------------------------------------------------------------------
check_db:
  # Layers checked by "--stage inputs" (run straight after S05): the S01-S05 layers,
  # by their key under layers:. "--stage all" (end of run_all) checks every layer.
  inputs_layers: [trade_flows, chokepoints, zones, gates, ports, country_port_shares,
                  events, gdelt_country_context]
  # Layers not built yet. A missing layer listed here is a WARN (expected gap) with its
  # reason; any other missing layer is a FAIL. Remove an entry once its script writes it.
  expected_missing_layers: {}
  web_routes_tolerance: 0.000001     # web_routes: sum of value x length may differ from the routes by this share
  # chokepoint_scores columns (besides chokepoint_id and name) must start with one of
  # these prefixes; the script named owns the prefix (CLAUDE.md prefix rule).
  score_prefixes:
    trade_: S06
    viol_: S07
    tens_: S07
    redund_: S08
    impact_: S08b
    quad_: S09
    score_: S09
    sens_: S10
  max_ids_listed: 10                 # IDs listed per failed check; project-made keys only, never event IDs
  zone_radius_tolerance: 0.01        # zone vertices within 1% of the radius from the centre (true-distance circles)
  length_tolerance_nm: 1             # a detour may not be shorter than its original route by more than this

# ---------------------------------------------------------------------
# GeoPackage layer names (proposal Table 3). Scripts must use these names.
# ---------------------------------------------------------------------
layers:
  trade_flows: trade_flows
  chokepoints: chokepoints
  zones: zones
  gates: gates                       # S03 (Decision 12): gate lines; S06 and S08 use them in place of the zone
  ports: ports
  country_port_shares: country_port_shares
  events: events
  gdelt_country_context: gdelt_country_context
  subflows: subflows
  routes: routes
  route_crossings: route_crossings
  detours: detours                   # S08 (Decision 10): per-flow detour lengths, one row per flow and closed chokepoint
  detour_routes: detour_routes       # S08 (Decision 10): rerouted lines; S08 never writes to routes
  reroute_costs: reroute_costs       # S08b (Decision 13): extra days and costs per detours row; not published
  chokepoint_scores: chokepoint_scores
  web_chokepoints: web_chokepoints
  web_routes: web_routes
